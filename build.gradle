plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'tacz-enhanced-pip-scopes'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            // Compatibility checks can use an isolated directory without
            // touching the usual development world's settings or saves.
            workingDirectory project.file(project.findProperty('pipRunDir') ?: 'run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // TaCZ ships an obfuscated refmap. Remap it to the Parchment names
            // used by this userdev runtime, matching TaCZ's own run setup.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
            args '--mixin', 'tacz_pip_scope.mixins.json'
            if (project.hasProperty('pipRenderChecks')) {
                property 'taczpip.renderChecks', 'true'
            }
            if (project.hasProperty('pipMenuSmoke')) {
                property 'taczpip.renderChecks', 'true'
                property 'taczpip.menuSmoke', 'true'
            }
            if (project.hasProperty('pipShaderWorldChecks')) {
                property 'taczpip.shaderWorldChecks', 'true'
                args '--quickPlaySingleplayer', 'taczpip-shader-check'
            }
            if (project.hasProperty('pipShaderAdsChecks')) {
                property 'taczpip.shaderAdsChecks', 'true'
            }

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }
    }
}

repositories {
    // Optional local, hash-verified compatibility test dependency; never bundled.
    if (project.hasProperty('pipEmbeddiumChecks') || project.hasProperty('pipOculusChecks')) {
        flatDir { dirs 'work' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    if (project.hasProperty('pipEmbeddiumChecks') || project.hasProperty('pipOculusChecks')) {
        runtimeOnly fg.deobf('local.embeddium:embeddium:0.3.31+mc1.20.1')
    }
    if (project.hasProperty('pipOculusChecks')) {
        runtimeOnly fg.deobf('local.oculus:oculus:mc1.20.1-1.8.0')
    }
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Officially documented TaCZ distribution route. fg.deobf makes its classes
    // available to this project without embedding TaCZ in our output JAR.
    implementation fg.deobf("curse.maven:timeless-and-classics-zero-${tacz_curse_project_id}:${tacz_curse_file_id}")
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            tacz_version: tacz_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'MixinConfigs'             : 'tacz_pip_scope.mixins.json',
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : mod_name,
                'Implementation-Version'   : project.version,
                'Implementation-Vendor'    : mod_authors,
                'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
